name: Deploy Cloudflare
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Resolve account and D1, migrate, deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID=$(node -e "fetch('https://api.cloudflare.com/client/v4/accounts',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(r=>r.json()).then(j=>{if(!j.success)throw Error(JSON.stringify(j.errors));let a=j.result[0];if(!a)throw Error('No account');process.stdout.write(a.id)})")
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          set +e; OUT=$(npx wrangler d1 create olasdechile-db --json 2>&1); set -e
          ID=$(printf '%s' "$OUT"|grep -Eo '[0-9a-f]{8}-[0-9a-f-]{27,}'|head -1)
          if [ -z "$ID" ]; then ID=$(node -e "fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(r=>r.json()).then(j=>process.stdout.write(j.result.find(x=>x.name==='olasdechile-db').uuid))"); fi
          sed -i -E "s/[0-9a-f]{8}-[0-9a-f-]{27,}/$ID/" wrangler.jsonc
          npx wrangler d1 migrations apply olasdechile-db --remote
          npx wrangler deploy
