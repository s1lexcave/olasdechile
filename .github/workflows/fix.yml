name: Fix D1 migration
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID=$(node -e "fetch('https://api.cloudflare.com/client/v4/accounts',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(r=>r.json()).then(j=>process.stdout.write(j.result[0].id))")
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          ID=$(node -e "fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(r=>r.json()).then(j=>process.stdout.write(j.result.find(x=>x.name==='olasdechile-db').uuid))")
          sed -i -E "s/[0-9a-f]{8}-[0-9a-f-]{27,}/$ID/" wrangler.jsonc
          npx wrangler d1 execute olasdechile-db --remote --command="CREATE TABLE IF NOT EXISTS admins (id INTEGER PRIMARY KEY CHECK (id = 1), username TEXT NOT NULL UNIQUE, password_hash TEXT NOT NULL, salt TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP); CREATE TABLE IF NOT EXISTS reservations (id INTEGER PRIMARY KEY AUTOINCREMENT, code TEXT NOT NULL UNIQUE, site_code TEXT NOT NULL, guest_name TEXT NOT NULL, phone TEXT NOT NULL DEFAULT '', guests INTEGER NOT NULL DEFAULT 1, check_in TEXT NOT NULL, check_out TEXT NOT NULL, total_clp INTEGER NOT NULL DEFAULT 0, paid_clp INTEGER NOT NULL DEFAULT 0, source TEXT NOT NULL DEFAULT 'Directo', notes TEXT NOT NULL DEFAULT '', created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP, updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP); CREATE INDEX IF NOT EXISTS idx_res_dates ON reservations(check_in, check_out); CREATE INDEX IF NOT EXISTS idx_res_site ON reservations(site_code);" -y
          npx wrangler deploy
