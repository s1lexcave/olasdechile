name: Deploy Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve main Cloudflare account
        id: acct
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID=$(node -e "fetch('https://api.cloudflare.com/client/v4/accounts',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(r=>r.json()).then(j=>{if(!j.success) throw Error(JSON.stringify(j.errors)); const a=j.result.find(x=>/nilsvanbrabant|proton/i.test(x.name))||j.result[0]; if(!a) throw Error('No account in token'); process.stdout.write(a.id)})")
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
      - name: Create or locate D1
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acct.outputs.account_id }}
        run: |
          set +e
          OUT=$(npx wrangler d1 create olasdechile-db --json 2>&1)
          set -e
          ID=$(printf '%s' "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let m=s.match(/[0-9a-f]{8}-[0-9a-f-]{27,}/i);if(m)process.stdout.write(m[0])})")
          if [ -z "$ID" ]; then
            ID=$(node -e "fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(r=>r.json()).then(j=>{const d=j.result.find(x=>x.name==='olasdechile-db');if(!d) throw Error('D1 not found '+JSON.stringify(j.errors));process.stdout.write(d.uuid)})")
          fi
          echo "database_id=$ID" >> "$GITHUB_OUTPUT"
      - name: Patch config
        run: |
          sed -i "s/[0-9a-f]\{8\}-[0-9a-f-]\{27,\}/${{ steps.d1.outputs.database_id }}/" wrangler.jsonc
      - name: Migrate D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acct.outputs.account_id }}
        run: npx wrangler d1 migrations apply olasdechile-db --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acct.outputs.account_id }}
        run: npx wrangler deploy
