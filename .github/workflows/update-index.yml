name: Update index and deploy
on:
  workflow_dispatch:
    inputs:
      url:
        description: Download URL for new index.ts
        required: true
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p src/src && curl -fsSL -X POST "${{ inputs.url }}" -o src/src/index.ts
      - run: |
          git config user.name s1lexcave
          git config user.email hello@s1lex.com
          git add src/src/index.ts
          git commit -m "Stats periods, demo seed endpoint, site logo" || true
          git push
      - run: npm install
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID=$(node -e "fetch('https://api.cloudflare.com/client/v4/accounts',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(r=>r.json()).then(j=>{if(!j.success)throw Error(JSON.stringify(j.errors));process.stdout.write(j.result[0].id)})")
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          ID=$(node -e "fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(r=>r.json()).then(j=>process.stdout.write(j.result.find(x=>x.name==='olasdechile-db').uuid))")
          sed -i -E "s/[0-9a-f]{8}-[0-9a-f-]{27,}/$ID/" wrangler.jsonc
          npx wrangler deploy
